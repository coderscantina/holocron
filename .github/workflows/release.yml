name: Release

# Runs on release tags that `release.sh` creates: vYY.M.D-<short commit>, e.g.
# v26.10.19-1a2b3c4, or vYY.M.D.N-<short commit> for the Nth release of a day. Waits for
# CI on the release commit, builds the Docker image on a native runner per platform, and
# creates a GitHub release whose notes are the version's CHANGELOG.md section.
on:
  push:
    tags:
      - 'v*'

concurrency:
  # Not keyed on the ref: two releases building in parallel would race for the
  # `latest` tag.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/coderscantina/holocron
  # The dependency layer (DuckDB) lives in the registry, not the Actions cache, which evicts
  # entries unused for 7 days: releases further apart would compile DuckDB every time.
  BUILD_CACHE: ghcr.io/coderscantina/holocron-buildcache

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag and extract release notes
        id: version
        run: |
          release="${GITHUB_REF_NAME#v}"
          version="${release%-*}"
          sha="${release##*-}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          # A same-day release YY.M.D.N has the crate version YY.M.D-N; release.sh sets both.
          expected=$(printf '%s' "$crate" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$/\1.\2/')
          if [ "$release" = "$version" ] || [ "$version" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$expected-<short commit>"
            exit 1
          fi
          if [ "$(git rev-parse --short="${#sha}" HEAD)" != "$sha" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name its commit $(git rev-parse --short HEAD)"
            exit 1
          fi
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section $version"
            exit 1
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

      # release.sh pushes main and the tag together, so CI is already running on this
      # commit. Publishing waits for it instead of running the same checks again.
      - name: Wait for CI on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 30); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::no CI run on $GITHUB_SHA. Push main before the tag."
            exit 1
          fi
          gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null

  image:
    needs: check
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            HOLOCRON_GIT_SHA=${{ needs.check.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Holocron
            org.opencontainers.image.description=Self-hosted analytics for Umami operators
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}:${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.BUILD_CACHE }}:${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          RELEASE: ${{ needs.check.outputs.release }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          digests=()
          for digest in *; do digests+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "$IMAGE:$RELEASE" -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "${digests[@]}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
