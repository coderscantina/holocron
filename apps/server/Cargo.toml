[package]
name = "holocron-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "holocron_server"
path = "src/lib.rs"

[[bin]]
name = "holocron"
path = "src/main.rs"

[features]
# `serve --frozen-clock`, for browser journeys at a pinned time. Off in packaged releases.
dev-clock = []

[dependencies]
holocron-analytics = { path = "../../crates/analytics" }
holocron-protocol = { path = "../../crates/protocol" }
holocron-storage = { path = "../../crates/storage" }
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.6"
axum = { workspace = true, features = ["macros"] }
base64 = "0.22"
bcrypt = "0.19"
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
hmac = "0.13"
http-body-util = "0.1"
ipnet = "2"
isbot = "0.1"
libc = "0.2"
# `mmap` maps the downloaded GeoIP file instead of copying it to the heap (decision 0018).
maxminddb = { version = "0.32", features = ["mmap"] }
serde.workspace = true
serde_html_form = "0.2"
serde_json = { workspace = true, features = ["raw_value", "unbounded_depth"] }
sha1 = "0.11"
sha2 = "0.10"
# PostgreSQL and MySQL only read Umami sources in `imports`; `any` gives both one row type.
sqlx = { workspace = true, features = ["postgres", "mysql", "mysql-rsa", "any", "tls-rustls-ring-webpki"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br", "limit", "timeout", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Blocking and small; already built for DuckDB. Only the GeoIP download uses it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[dev-dependencies]
# The gate fixture and explore suite for the `summary_load` and `collect_burst` examples.
holocron-workload = { path = "../../crates/workload" }
http-body-util = { version = "0.1", features = ["channel"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
